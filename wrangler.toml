name = "corrida-solidaria"
main = "src/index.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "treinosolidario.lccidadedovinho.com.br", custom_domain = true },
]

# Servir arquivos estáticos de ./public
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "corrida-solidaria"
database_id = "eb4a816e-4717-416f-ad7c-48c121f32ae5"
migrations_dir = "migrations"

# KV: cache do access_token Sicredi (expira em 300s).
[[kv_namespaces]]
binding = "TOKENS"
id = "c19d155ab3d7471f9fccdcfed901f6bd"

# mTLS Sicredi (cert 06304442000108, expira 11/09/2028)
[[mtls_certificates]]
binding = "SICREDI"
certificate_id = "e53450f5-0151-4938-abc5-96e2b47e6c8e"

[observability]
enabled = true

[vars]
SICREDI_AMBIENTE = "producao"

# Secrets em prod (definir com `wrangler secret put NOME`):
#   PAINEL_SENHA
#   SICREDI_CLIENT_ID
#   SICREDI_CLIENT_SECRET
#   SICREDI_CHAVE_PIX          # chave Pix (ex.: CNPJ 06304442000108)
#   SICREDI_WEBHOOK_URL        # https://treinosolidario.lccidadedovinho.com.br/api/webhook
#   SICREDI_VALOR_INSCRICAO    # opcional; default 0 se não definido
#
# NÃO setar SICREDI_MOCK em prod (habilita rota /api/dev/pagar).
